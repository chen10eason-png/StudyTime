<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>StudyTime 讀書計時</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root{
      --bg:#f4f6fb; --card:rgba(255,255,255,.88); --text:#172033; --muted:#78839a;
      --primary:#4f6df5; --primary2:#7a5df6; --line:#e6eaf2; --good:#1fa97a; --warn:#f59e0b;
      --shadow:0 14px 40px rgba(39,50,85,.10);
    }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Segoe UI,sans-serif;background:linear-gradient(180deg,#f7f9fd,#eef2f9);color:var(--text)}
    .app{max-width:560px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:28px}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .badge{font-size:12px;background:#eef1ff;color:#5167d9;padding:7px 10px;border-radius:999px;font-weight:700}
    .card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
    .row{display:flex;gap:10px}.grow{flex:1}.label{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:7px}
    select,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 12px;font-size:16px;color:var(--text);outline:none}
    .timer-wrap{text-align:center;padding:8px 0 3px}.timer{font-size:52px;letter-spacing:-2px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0 6px}.current{color:var(--muted);font-size:14px}
    .actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.btn{border:0;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;min-width:160px;box-shadow:0 10px 24px rgba(79,109,245,.28)}.btn.light{background:#eef1f6;color:#4c566c}.btn.danger{background:#fff0f1;color:#d24855}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f8fc;border-radius:17px;padding:14px}.metric .v{font-size:22px;font-weight:800;margin-top:3px}.metric .k{font-size:12px;color:var(--muted)}
    .subject{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.subject:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#eef1ff;font-size:18px}.name{font-weight:800}.bar{height:7px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:999px}.time{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
    .goal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.goal-title{font-weight:800}.goal-meta{color:var(--muted);font-size:12px}.progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:10px 0 7px}.progress > div{height:100%;background:linear-gradient(90deg,#5b7cff,#7d5ff6);border-radius:999px}.goal-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
    dialog{border:0;border-radius:24px;max-width:500px;width:calc(100% - 28px);padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,26,40,.35);backdrop-filter:blur(4px)}.modal{padding:20px}.modal h3{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .empty{color:var(--muted);font-size:14px;text-align:center;padding:8px}
    .nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 24px));background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.75);box-shadow:0 12px 35px rgba(33,45,79,.16);border-radius:22px;padding:8px;display:flex;justify-content:space-around;z-index:10}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:14px;color:#69748c;font-size:12px;font-weight:700}.nav button.active{background:#eef1ff;color:#4f64d8}
    .hidden{display:none!important}
    .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-head button{border:0;background:#f0f3f9;width:38px;height:38px;border-radius:12px;font-size:18px;color:var(--text)}.cal-title{font-weight:850;font-size:18px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays div{text-align:center;color:var(--muted);font-size:11px;font-weight:800;padding:5px 0}.day{aspect-ratio:.9;border:0;border-radius:13px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;background:#f7f8fb;color:var(--text);font-family:inherit;min-width:0}.day.blank{background:transparent}.day.today{outline:2px solid #6b78ee;outline-offset:-2px}.day .num{font-size:12px;font-weight:800}.day .spent{font-size:9px;font-weight:850;line-height:1.15;text-align:center;white-space:normal}.day.has-time{cursor:pointer}.legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:12px;color:var(--muted);font-size:10px}.legend i{width:17px;height:10px;border-radius:4px;display:block}.detail-total{font-size:26px;font-weight:850;margin:3px 0 14px}.detail-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.detail-row b{font-size:14px}.detail-row span{font-weight:800;font-size:14px}

    /* V1.2 — iPad 橫向 / Desktop dashboard */
    @media (min-width: 900px) and (orientation: landscape){
      body{background:radial-gradient(circle at 18% 0%,#fff 0,#f5f7fc 36%,#edf1f8 100%)}
      .app{max-width:1440px;padding:28px 34px 112px}
      header{margin-bottom:22px}.brand h1{font-size:32px}
      #timerView:not(.hidden){display:grid;grid-template-columns:minmax(420px,.95fr) minmax(500px,1.25fr);gap:18px;align-items:start}
      #timerView:not(.hidden)>section:nth-child(1){grid-row:1 / span 2;position:sticky;top:28px;padding:26px}
      #timerView:not(.hidden)>section:nth-child(2){grid-column:2}
      #timerView:not(.hidden)>section:nth-child(3){grid-column:2}
      #timerView .timer-wrap{padding:34px 10px 22px}
      #timerView .timer{font-size:76px;margin:24px 0 10px;letter-spacing:-3px}
      #timerView .actions{margin-top:28px}
      #timerView .btn.primary{min-width:200px;padding:16px 22px}
      .summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.metric{padding:20px}.metric .v{font-size:30px}
      #subjectsView:not(.hidden),#goalsView:not(.hidden){max-width:1050px;margin:0 auto}
      #subjectsView .card,#goalsView .card{padding:26px}
      #subjectList{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
      #subjectList .subject:nth-last-child(2){border-bottom:0}
      #calendarView:not(.hidden){max-width:1180px;margin:0 auto}
      #calendarView .card{padding:26px 30px 28px}
      .cal-title{font-size:23px}.cal-head button{width:44px;height:44px}
      .weekdays,.calendar{gap:9px}.weekdays div{font-size:13px;padding:8px 0}
      .day{aspect-ratio:1.28;border-radius:17px;padding:10px 7px;gap:8px}.day .num{font-size:14px}.day .spent{font-size:12px}
      .legend{font-size:12px;margin-top:16px}.legend i{width:24px;height:12px}
      .nav{width:auto;min-width:520px;padding:8px 12px;bottom:18px}.nav button{min-width:108px;font-size:13px;padding:10px 18px}
      dialog{max-width:560px}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>StudyTime</h1><p>把讀書時間累積成看得見的進步</p></div>
    <div class="badge">V1.4</div>
  </header>

  <main id="timerView">
    <section class="card">
      <div class="label">正在讀哪一科？</div>
      <select id="subjectSelect"></select>
      <div class="timer-wrap">
        <div class="timer" id="timer">00:00:00</div>
        <div class="current" id="timerHint">按開始後就會累計到所選科目</div>
        <div class="actions">
          <button class="btn primary" id="startBtn">開始讀書</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><h2>今天</h2><span id="todayDate"></span></div>
      <div class="summary">
        <div class="metric"><div class="k">今日讀書</div><div class="v" id="todayTotal">0 分鐘</div></div>
        <div class="metric"><div class="k">累積總時數</div><div class="v" id="allTotal">0 小時</div></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><h2>目前目標</h2><button class="btn light" style="padding:8px 11px;font-size:13px" id="addGoalBtn">＋ 新增</button></div>
      <div id="goalList"></div>
    </section>
  </main>

  <main id="subjectsView" class="hidden">
    <section class="card">
      <div class="section-title"><h2>各科讀書時間</h2><span>全部累積</span></div>
      <div id="subjectList"></div>
    </section>
  </main>

  <main id="calendarView" class="hidden">
    <section class="card">
      <div class="cal-head"><button id="prevMonth" aria-label="上個月">‹</button><div class="cal-title" id="calTitle"></div><button id="nextMonth" aria-label="下個月">›</button></div>
      <div class="weekdays"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="calendar" id="calendar"></div>
      <div class="legend"><span>少</span><i style="background:#eef1ff"></i><i style="background:#dce2ff"></i><i style="background:#bdc9ff"></i><i style="background:#91a4fb"></i><i style="background:#667df2"></i><span>多</span></div>
    </section>
  </main>

  <main id="goalsView" class="hidden">
    <section class="card">
      <div class="section-title"><h2>讀書目標</h2><button class="btn light" style="padding:8px 11px;font-size:13px" id="addGoalBtn2">＋ 新增</button></div>
      <div id="goalList2"></div>
    </section>
  </main>
</div>

<nav class="nav">
  <button class="active" data-view="timerView">⏱<br>計時</button>
  <button data-view="subjectsView">📚<br>科目</button>
  <button data-view="calendarView">📅<br>月曆</button>
  <button data-view="goalsView">🎯<br>目標</button>
</nav>

<dialog id="goalDialog">
  <div class="modal">
    <h3>新增讀書目標</h3>
    <div class="form-grid">
      <div class="full"><div class="label">科目</div><select id="goalSubject"></select></div>
      <div><div class="label">目標小時</div><input id="goalHours" type="number" min="0" value="1"></div>
      <div><div class="label">目標分鐘</div><input id="goalMinutes" type="number" min="0" max="59" value="0"></div>
      <div class="full"><div class="label">完成期限</div><input id="goalDeadline" type="date"></div>
    </div>
    <div class="modal-actions">
      <button class="btn light" id="cancelGoal">取消</button>
      <button class="btn primary" style="min-width:110px" id="saveGoal">儲存目標</button>
    </div>
  </div>
</dialog>

<dialog id="dayDialog"><div class="modal"><h3 id="dayDetailTitle">讀書紀錄</h3><div class="detail-total" id="dayDetailTotal"></div><div id="dayDetailList"></div><div class="modal-actions"><button class="btn primary" style="min-width:100px" id="closeDay">完成</button></div></div></dialog>

<script>
const subjects = [
  ['國文','文'],['英文','A'],['數學','∑'],['物理','⚛'],['化學','⚗'],['生物','🧬'],['地科（地球科學）','🌍'],['歷史','🏛'],['地理','🗺'],['公民','⚖']
];
const KEY='studytime_v1';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || { totals:{}, sessions:[], goals:[], running:null };
subjects.forEach(([s])=>{ if(state.totals[s]==null) state.totals[s]=0; });
let tick=null;
let calCursor=new Date(); calCursor.setDate(1);

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');}
function short(sec){ if(sec<3600) return `${Math.floor(sec/60)} 分鐘`; const h=sec/3600; return `${h<10?h.toFixed(1):Math.round(h)} 小時`; }
function todayKey(d=new Date()){return dateLocalKey(d)}
function runningElapsed(){return state.running ? Math.max(0,Math.floor((Date.now()-state.running.startedAt)/1000)) : 0;}
function totalForSubject(subj){return (state.totals[subj]||0) + (state.running?.subject===subj ? runningElapsed():0)}
function todaySubjectTotal(subj){
  const key=todayKey();
  let sum=state.sessions.filter(x=>x.date===key && x.subject===subj).reduce((a,b)=>a+b.seconds,0);
  if(state.running?.subject===subj) sum+=runningTodaySeconds();
  return sum;
}
function todayTotal(){
  const key=todayKey();
  let sum=state.sessions.filter(x=>x.date===key).reduce((a,b)=>a+b.seconds,0);
  if(state.running) sum+=runningTodaySeconds();
  return sum;
}
function allTotal(){return Object.values(state.totals).reduce((a,b)=>a+b,0)+runningElapsed();}
function startOfLocalDayMs(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function runningTodaySeconds(){
  if(!state.running)return 0;
  const start=Math.max(state.running.startedAt,startOfLocalDayMs());
  return Math.max(0,Math.floor((Date.now()-start)/1000));
}
function splitAndCommitRunning(endMs=Date.now()){
  if(!state.running)return;
  const subj=state.running.subject;
  let cursor=state.running.startedAt;
  while(cursor<endMs){
    const d=new Date(cursor);
    const nextMidnight=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();
    const segmentEnd=Math.min(endMs,nextMidnight);
    const seconds=Math.max(0,Math.floor((segmentEnd-cursor)/1000));
    if(seconds>0){
      const date=dateLocalKey(new Date(cursor));
      state.sessions.push({subject:subj,seconds,date,startedAt:cursor,endedAt:segmentEnd});
      state.totals[subj]=(state.totals[subj]||0)+seconds;
    }
    cursor=segmentEnd;
  }
  state.running=null;
}

function initSelects(){
  ['#subjectSelect','#goalSubject'].forEach(id=>{$(id).innerHTML=subjects.map(([s])=>`<option>${s}</option>`).join('')});
  const tomorrow=new Date(Date.now()+86400000); $('#goalDeadline').value=tomorrow.toISOString().slice(0,10);
}
function renderTimer(){
  const running=!!state.running;
  const selected=$('#subjectSelect').value;
  $('#timer').textContent=fmt(todayTotal());
  $('#startBtn').textContent=running?'暫停':'開始讀書';
  $('#subjectSelect').disabled=false;
  if(running && $('#subjectSelect').value!==state.running.subject) $('#subjectSelect').value=state.running.subject;
  $('#timerHint').textContent=running?`今日總時間 · 正在讀 ${state.running.subject}`:`今日總時間 · 目前選擇 ${selected}`;
  $('#todayTotal').textContent=short(todayTotal()); $('#allTotal').textContent=short(allTotal());
}
function renderSubjects(){
  const max=Math.max(1,...subjects.map(([s])=>totalForSubject(s)));
  $('#subjectList').innerHTML=subjects.map(([s,ic])=>{const v=totalForSubject(s);return `<div class="subject"><div class="icon">${ic}</div><div><div class="name">${s}</div><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div></div><div class="time">${short(v)}</div></div>`}).join('');
}
function goalProgress(g){
  const after = state.sessions.filter(x=>x.subject===g.subject && x.endedAt>=g.createdAt).reduce((a,b)=>a+b.seconds,0);
  let cur=after; if(state.running?.subject===g.subject){const from=Math.max(state.running.startedAt,g.createdAt);if(Date.now()>from)cur+=Math.floor((Date.now()-from)/1000);}
  return cur;
}
function goalHTML(g){
  const cur=goalProgress(g), pct=Math.min(100, Math.round(cur/g.targetSeconds*100)); const remain=Math.max(0,g.targetSeconds-cur);
  const expired=new Date(g.deadline+'T23:59:59').getTime()<Date.now() && pct<100;
  return `<div style="padding:8px 0 14px;border-bottom:1px solid var(--line)"><div class="goal-head"><div><div class="goal-title">${g.subject}</div><div class="goal-meta">${g.deadline} 前完成 ${short(g.targetSeconds)}</div></div><button onclick="removeGoal('${g.id}')" class="btn danger" style="padding:7px 9px;font-size:12px">刪除</button></div><div class="progress"><div style="width:${pct}%"></div></div><div class="goal-foot"><span>${pct}% 完成${expired?' · 已逾期':''}</span><span>剩 ${short(remain)}</span></div></div>`;
}
function renderGoals(){ const html=state.goals.length?state.goals.map(goalHTML).join(''):'<div class="empty">還沒有目標，可以設定「幾天內要讀幾小時」。</div>'; $('#goalList').innerHTML=html;$('#goalList2').innerHTML=html; }
function dateLocalKey(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function dailyBySubject(key){const out={};state.sessions.filter(x=>x.date===key).forEach(x=>out[x.subject]=(out[x.subject]||0)+x.seconds);if(state.running && key===todayKey())out[state.running.subject]=(out[state.running.subject]||0)+runningTodaySeconds();return out;}
function daySum(key){return Object.values(dailyBySubject(key)).reduce((a,b)=>a+b,0);}
function dayLabel(sec){if(sec<60)return '<1分';const m=Math.floor(sec/60);if(m<60)return `${m}分`;const h=Math.floor(m/60),r=m%60;return r?`${h}時${r}分`:`${h}小時`;}
function heat(sec){if(!sec)return '#f7f8fb';const min=sec/60;if(min<30)return '#eef1ff';if(min<60)return '#dce2ff';if(min<120)return '#bdc9ff';if(min<240)return '#91a4fb';return '#667df2';}
function renderCalendar(){const y=calCursor.getFullYear(),m=calCursor.getMonth();$('#calTitle').textContent=`${y} 年 ${m+1} 月`;const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let html='';for(let i=0;i<first;i++)html+='<div class="day blank"></div>';for(let d=1;d<=days;d++){const dt=new Date(y,m,d),key=dateLocalKey(dt),sec=daySum(key),today=key===dateLocalKey(new Date());const fg=sec>=240*60?'#fff':'var(--text)';html+=`<button class="day ${sec?'has-time':''} ${today?'today':''}" data-date="${key}" style="background:${heat(sec)};color:${fg}"><span class="num">${d}</span>${sec?`<span class="spent">${dayLabel(sec)}</span>`:''}</button>`;}$('#calendar').innerHTML=html;$$('.day.has-time').forEach(el=>el.onclick=()=>openDay(el.dataset.date));}
function openDay(key){const parts=key.split('-').map(Number),data=dailyBySubject(key),total=Object.values(data).reduce((a,b)=>a+b,0);$('#dayDetailTitle').textContent=`${parts[1]} 月 ${parts[2]} 日`;$('#dayDetailTotal').textContent=`共讀 ${short(total)}`;$('#dayDetailList').innerHTML=subjects.filter(([s])=>data[s]).map(([s,ic])=>`<div class="detail-row"><b>${ic} ${s}</b><span>${short(data[s])}</span></div>`).join('');$('#dayDialog').showModal();}
function render(){renderTimer();renderSubjects();renderGoals();renderCalendar();}

$('#startBtn').onclick=()=>{
  if(!state.running){state.running={subject:$('#subjectSelect').value,startedAt:Date.now()};}
  else {splitAndCommitRunning();}
  save();render();
};
$('#subjectSelect').addEventListener('change',()=>{
  const next=$('#subjectSelect').value;
  if(state.running && next!==state.running.subject){
    splitAndCommitRunning();
    state.running={subject:next,startedAt:Date.now()};
    save();
  }
  render();
});

function openGoal(){ $('#goalDialog').showModal(); }
$('#addGoalBtn').onclick=openGoal; $('#addGoalBtn2').onclick=openGoal; $('#cancelGoal').onclick=()=>$('#goalDialog').close();
$('#saveGoal').onclick=()=>{const h=Number($('#goalHours').value||0),m=Number($('#goalMinutes').value||0),target=(h*60+m)*60,deadline=$('#goalDeadline').value;if(target<=0||!deadline){alert('請輸入目標時間與期限');return;}state.goals.unshift({id:crypto.randomUUID(),subject:$('#goalSubject').value,targetSeconds:target,deadline,createdAt:Date.now()});save();$('#goalDialog').close();render();};
window.removeGoal=id=>{state.goals=state.goals.filter(g=>g.id!==id);save();render();};

$$('.nav button').forEach(btn=>btn.onclick=()=>{$$('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['timerView','subjectsView','calendarView','goalsView'].forEach(v=>$('#'+v).classList.add('hidden'));$('#'+btn.dataset.view).classList.remove('hidden');render();});

$('#prevMonth').onclick=()=>{calCursor.setMonth(calCursor.getMonth()-1);renderCalendar();};
$('#nextMonth').onclick=()=>{calCursor.setMonth(calCursor.getMonth()+1);renderCalendar();};
$('#closeDay').onclick=()=>$('#dayDialog').close();

$('#todayDate').textContent=new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date());
initSelects();render();
let lastDayKey=todayKey();
tick=setInterval(()=>{
  const nowKey=todayKey();
  if(nowKey!==lastDayKey && state.running){
    const subj=state.running.subject;
    const now=Date.now();
    splitAndCommitRunning(now);
    state.running={subject:subj,startedAt:now};
    save();
  }
  lastDayKey=nowKey;
  render();
},1000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
