<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>StudyTime 讀書計時</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{
      --bg:#f4f6fb; --card:rgba(255,255,255,.88); --text:#172033; --muted:#78839a;
      --primary:#4f6df5; --primary2:#7a5df6; --line:#e6eaf2; --good:#1fa97a; --warn:#f59e0b;
      --shadow:0 14px 40px rgba(39,50,85,.10);
    }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Segoe UI,sans-serif;background:linear-gradient(180deg,#f7f9fd,#eef2f9);color:var(--text)}
    .app{max-width:560px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:28px}.brand p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .badge{font-size:12px;background:#eef1ff;color:#5167d9;padding:7px 10px;border-radius:999px;font-weight:700}
    .card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
    .row{display:flex;gap:10px}.grow{flex:1}.label{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:7px}
    select,input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 12px;font-size:16px;color:var(--text);outline:none}
    .timer-wrap{text-align:center;padding:8px 0 3px}.timer{font-size:52px;letter-spacing:-2px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0 6px}.current{color:var(--muted);font-size:14px}
    .actions{display:flex;gap:10px;justify-content:center;margin-top:18px}.btn{border:0;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;min-width:160px;box-shadow:0 10px 24px rgba(79,109,245,.28)}.btn.light{background:#eef1f6;color:#4c566c}.btn.danger{background:#fff0f1;color:#d24855}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-title h2{font-size:18px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f8fc;border-radius:17px;padding:14px}.metric .v{font-size:22px;font-weight:800;margin-top:3px}.metric .k{font-size:12px;color:var(--muted)}
    .subject{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.subject:last-child{border-bottom:0}.icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#eef1ff;font-size:18px}.name{font-weight:800}.bar{height:7px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:999px}.time{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
    .goal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.goal-title{font-weight:800}.goal-meta{color:var(--muted);font-size:12px}.progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:10px 0 7px}.progress > div{height:100%;background:linear-gradient(90deg,#5b7cff,#7d5ff6);border-radius:999px}.goal-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
    dialog{border:0;border-radius:24px;max-width:500px;width:calc(100% - 28px);padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,26,40,.35);backdrop-filter:blur(4px)}.modal{padding:20px}.modal h3{margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .empty{color:var(--muted);font-size:14px;text-align:center;padding:8px}
    .nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 24px));background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.75);box-shadow:0 12px 35px rgba(33,45,79,.16);border-radius:22px;padding:8px;display:flex;justify-content:space-around;z-index:10}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:14px;color:#69748c;font-size:12px;font-weight:700}.nav button.active{background:#eef1ff;color:#4f64d8}
    .hidden{display:none!important}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>StudyTime</h1><p>把讀書時間累積成看得見的進步</p></div>
    <div class="badge">V1.0</div>
  </header>

  <main id="timerView">
    <section class="card">
      <div class="label">正在讀哪一科？</div>
      <select id="subjectSelect"></select>
      <div class="timer-wrap">
        <div class="timer" id="timer">00:00:00</div>
        <div class="current" id="timerHint">按開始後就會累計到所選科目</div>
        <div class="actions">
          <button class="btn primary" id="startBtn">開始讀書</button>
          <button class="btn light hidden" id="finishBtn">完成本次</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><h2>今天</h2><span id="todayDate"></span></div>
      <div class="summary">
        <div class="metric"><div class="k">今日讀書</div><div class="v" id="todayTotal">0 分鐘</div></div>
        <div class="metric"><div class="k">累積總時數</div><div class="v" id="allTotal">0 小時</div></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><h2>目前目標</h2><button class="btn light" style="padding:8px 11px;font-size:13px" id="addGoalBtn">＋ 新增</button></div>
      <div id="goalList"></div>
    </section>
  </main>

  <main id="subjectsView" class="hidden">
    <section class="card">
      <div class="section-title"><h2>各科讀書時間</h2><span>全部累積</span></div>
      <div id="subjectList"></div>
    </section>
  </main>

  <main id="goalsView" class="hidden">
    <section class="card">
      <div class="section-title"><h2>讀書目標</h2><button class="btn light" style="padding:8px 11px;font-size:13px" id="addGoalBtn2">＋ 新增</button></div>
      <div id="goalList2"></div>
    </section>
  </main>
</div>

<nav class="nav">
  <button class="active" data-view="timerView">⏱<br>計時</button>
  <button data-view="subjectsView">📚<br>科目</button>
  <button data-view="goalsView">🎯<br>目標</button>
</nav>

<dialog id="goalDialog">
  <div class="modal">
    <h3>新增讀書目標</h3>
    <div class="form-grid">
      <div class="full"><div class="label">科目</div><select id="goalSubject"></select></div>
      <div><div class="label">目標小時</div><input id="goalHours" type="number" min="0" value="1"></div>
      <div><div class="label">目標分鐘</div><input id="goalMinutes" type="number" min="0" max="59" value="0"></div>
      <div class="full"><div class="label">完成期限</div><input id="goalDeadline" type="date"></div>
    </div>
    <div class="modal-actions">
      <button class="btn light" id="cancelGoal">取消</button>
      <button class="btn primary" style="min-width:110px" id="saveGoal">儲存目標</button>
    </div>
  </div>
</dialog>

<script>
const subjects = [
  ['國文','文'],['英文','A'],['數學','∑'],['物理','⚛'],['化學','⚗'],['生物','🧬'],['地科（地球科學）','🌍'],['歷史','🏛'],['地理','🗺'],['公民','⚖']
];
const KEY='studytime_v1';
let state = JSON.parse(localStorage.getItem(KEY) || 'null') || { totals:{}, sessions:[], goals:[], running:null };
subjects.forEach(([s])=>{ if(state.totals[s]==null) state.totals[s]=0; });
let tick=null;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');}
function short(sec){ if(sec<3600) return `${Math.floor(sec/60)} 分鐘`; const h=sec/3600; return `${h<10?h.toFixed(1):Math.round(h)} 小時`; }
function todayKey(d=new Date()){return d.toISOString().slice(0,10)}
function runningElapsed(){return state.running ? Math.floor((Date.now()-state.running.startedAt)/1000) : 0;}
function totalForSubject(subj){return (state.totals[subj]||0) + (state.running?.subject===subj ? runningElapsed():0)}
function todayTotal(){const t=todayKey();let sum=state.sessions.filter(x=>x.date===t).reduce((a,b)=>a+b.seconds,0);if(state.running && todayKey(new Date(state.running.startedAt))===t) sum+=runningElapsed();return sum;}
function allTotal(){return Object.values(state.totals).reduce((a,b)=>a+b,0)+runningElapsed();}

function initSelects(){
  ['#subjectSelect','#goalSubject'].forEach(id=>{$(id).innerHTML=subjects.map(([s])=>`<option>${s}</option>`).join('')});
  const tomorrow=new Date(Date.now()+86400000); $('#goalDeadline').value=tomorrow.toISOString().slice(0,10);
}
function renderTimer(){
  const elapsed=runningElapsed(); $('#timer').textContent=fmt(elapsed);
  const running=!!state.running; $('#startBtn').textContent=running?'暫停':'開始讀書'; $('#finishBtn').classList.toggle('hidden',!running);
  $('#subjectSelect').disabled=running; if(running) $('#subjectSelect').value=state.running.subject;
  $('#timerHint').textContent=running?`正在累計：${state.running.subject}`:'按開始後就會累計到所選科目';
  $('#todayTotal').textContent=short(todayTotal()); $('#allTotal').textContent=short(allTotal());
}
function renderSubjects(){
  const max=Math.max(1,...subjects.map(([s])=>totalForSubject(s)));
  $('#subjectList').innerHTML=subjects.map(([s,ic])=>{const v=totalForSubject(s);return `<div class="subject"><div class="icon">${ic}</div><div><div class="name">${s}</div><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div></div><div class="time">${short(v)}</div></div>`}).join('');
}
function goalProgress(g){
  const after = state.sessions.filter(x=>x.subject===g.subject && x.endedAt>=g.createdAt).reduce((a,b)=>a+b.seconds,0);
  let cur=after; if(state.running?.subject===g.subject && state.running.startedAt>=g.createdAt)cur+=runningElapsed();
  return cur;
}
function goalHTML(g){
  const cur=goalProgress(g), pct=Math.min(100, Math.round(cur/g.targetSeconds*100)); const remain=Math.max(0,g.targetSeconds-cur);
  const expired=new Date(g.deadline+'T23:59:59').getTime()<Date.now() && pct<100;
  return `<div style="padding:8px 0 14px;border-bottom:1px solid var(--line)"><div class="goal-head"><div><div class="goal-title">${g.subject}</div><div class="goal-meta">${g.deadline} 前完成 ${short(g.targetSeconds)}</div></div><button onclick="removeGoal('${g.id}')" class="btn danger" style="padding:7px 9px;font-size:12px">刪除</button></div><div class="progress"><div style="width:${pct}%"></div></div><div class="goal-foot"><span>${pct}% 完成${expired?' · 已逾期':''}</span><span>剩 ${short(remain)}</span></div></div>`;
}
function renderGoals(){ const html=state.goals.length?state.goals.map(goalHTML).join(''):'<div class="empty">還沒有目標，可以設定「幾天內要讀幾小時」。</div>'; $('#goalList').innerHTML=html;$('#goalList2').innerHTML=html; }
function render(){renderTimer();renderSubjects();renderGoals();}

$('#startBtn').onclick=()=>{
  if(!state.running){state.running={subject:$('#subjectSelect').value,startedAt:Date.now()};}
  else {commitRunning();}
  save();render();
};
function commitRunning(){if(!state.running)return; const seconds=runningElapsed(); if(seconds>0){const subj=state.running.subject;state.totals[subj]=(state.totals[subj]||0)+seconds;state.sessions.push({subject:subj,seconds,date:todayKey(new Date(state.running.startedAt)),startedAt:state.running.startedAt,endedAt:Date.now()});} state.running=null;}
$('#finishBtn').onclick=()=>{commitRunning();save();render();};

function openGoal(){ $('#goalDialog').showModal(); }
$('#addGoalBtn').onclick=openGoal; $('#addGoalBtn2').onclick=openGoal; $('#cancelGoal').onclick=()=>$('#goalDialog').close();
$('#saveGoal').onclick=()=>{const h=Number($('#goalHours').value||0),m=Number($('#goalMinutes').value||0),target=(h*60+m)*60,deadline=$('#goalDeadline').value;if(target<=0||!deadline){alert('請輸入目標時間與期限');return;}state.goals.unshift({id:crypto.randomUUID(),subject:$('#goalSubject').value,targetSeconds:target,deadline,createdAt:Date.now()});save();$('#goalDialog').close();render();};
window.removeGoal=id=>{state.goals=state.goals.filter(g=>g.id!==id);save();render();};

$$('.nav button').forEach(btn=>btn.onclick=()=>{$$('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');['timerView','subjectsView','goalsView'].forEach(v=>$('#'+v).classList.add('hidden'));$('#'+btn.dataset.view).classList.remove('hidden');render();});

$('#todayDate').textContent=new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date());
initSelects();render();tick=setInterval(render,1000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
